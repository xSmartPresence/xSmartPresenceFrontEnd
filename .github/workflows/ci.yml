name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # No tests exist yet. When you add a test runner (e.g. Vitest):
      #   1. Add it to package.json devDependencies
      #   2. Add a "test" script: "vitest run"
      #   3. Uncomment the step below
      #
      # - name: Test
      #   run: npm test